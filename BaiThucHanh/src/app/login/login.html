<div class="login-page">
  <div class="login-card">
    <h1>Đăng nhập</h1>
    <p class="subtitle">Chào mừng bạn quay trở lại!</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Tên đăng nhập</label>

        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Nhập tên đăng nhập"
        />

        <small
          class="error"
          *ngIf="
            loginForm.get('username')?.hasError('required') && loginForm.get('username')?.touched
          "
        >
          Vui lòng nhập tên đăng nhập.
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Mật khẩu</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Nhập mật khẩu"
        />

        <small
          class="error"
          *ngIf="
            loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched
          "
        >
          Vui lòng nhập mật khẩu.
        </small>
      </div>

      <!-- API error -->
      <small class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </small>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="register-link">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký</a>
    </p>
  </div>
</div>
